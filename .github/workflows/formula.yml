name: Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Audit, install and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # macOS runners carry Homebrew; Ubuntu runners no longer do, so both
      # jobs install it the same way rather than one trusting the image.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.19.1

      # Linking the checkout in as the tap is what makes the audit read these
      # files rather than whatever main already holds, so a pull request is
      # checked before it merges.
      - name: Tap this checkout
        run: |
          taps="$(brew --repository)/Library/Taps/jzills"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew tap

      # Every formula in Formula/, so a tool listed in the README before its
      # first release isn't audited until its release commits the formula.
      - name: Audit
        run: |
          for f in Formula/*.rb; do
            brew audit --strict --online "jzills/tap/$(basename "$f" .rb)"
          done

      - name: Install
        run: |
          for f in Formula/*.rb; do
            brew install --formula --verbose "jzills/tap/$(basename "$f" .rb)"
          done

      - name: Test
        run: |
          for f in Formula/*.rb; do
            brew test --verbose "jzills/tap/$(basename "$f" .rb)"
          done

      # The archive is per-OS and per-architecture, so the job that installed
      # it says which one it proved.
      - name: Report what ran
        run: |
          for f in Formula/*.rb; do
            "$(basename "$f" .rb)" --version
          done
          echo "installed on ${{ matrix.os }} ($(uname -m))"
